name: Backend CI

on:
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"
  push:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: "1.27.1"
          cache-dependency-path: "backend/go.sum"

      - name: Download dependencies
        run: go mod download

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      # The schema the SQL tests query, built by the project's own migrator so
      # CI exercises the same path a deployment does.
      - name: Migrate the test database
        env:
          DATABASE_URL: "postgresql://postgres:password@localhost:5432/postgres?sslmode=disable"
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          MARKET_KEK_KEYS: ${{ secrets.MARKET_KEK_KEYS }}
          PATH_MIGRATION: ${{ secrets.PATH_MIGRATION }}
        run: go run ./cmd/migrator -cmd=up

      - name: Test
        env:
          DATABASE_URL: "postgresql://postgres:password@localhost:5432/postgres?sslmode=disable"
          TEST_DATABASE_URL: "postgresql://postgres:password@localhost:5432/postgres?sslmode=disable"
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          MARKET_KEK_KEYS: ${{ secrets.MARKET_KEK_KEYS }}
          PATH_MIGRATION: ${{ secrets.PATH_MIGRATION }}
        run: go test ./... -count=1 -coverprofile=coverage.out

      - name: Coverage summary
        run: go tool cover -func=coverage.out | tail -1

  lint:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: "1.27.1"
          cache-dependency-path: "backend/go.sum"

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.13.1
          working-directory: backend
