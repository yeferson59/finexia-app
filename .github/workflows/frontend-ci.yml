name: Frontend CI

on:
  pull_request:
    paths:
      - "frontend/**"
      - ".github/workflows/frontend-ci.yml"
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - ".github/workflows/frontend-ci.yml"

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    env:
      # The `prepare` script runs a blanket `playwright install`; skip it and
      # install only Chromium (the browser used by unit browser tests and e2e).
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 11

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install

      - name: Install Chromium for Playwright
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: ""
        run: pnpm exec playwright install --with-deps chromium

      - name: Check (svelte-check + tsc)
        run: pnpm check

      - name: Lint (prettier + eslint)
        run: pnpm lint

      - name: Arquitectura (tamaño, routes/ y legacy)
        run: pnpm check:arch

      # El manual y su PDF son dos archivos: sin esto es fácil corregir una
      # sección y seguir publicando el PDF viejo durante meses.
      - name: Guía de usuario (PDF al día)
        run: pnpm check:manual

      - name: Unit tests
        run: pnpm test:unit -- --run

      - name: E2E tests
        run: pnpm test:e2e
